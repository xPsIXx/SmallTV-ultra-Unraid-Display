; SmallTV UnraidClaw dashboard
; Default target: GeekMagic SmallTV / SmallTV-Ultra (ESP-12F / ESP8266)
;
; Build:  pio run -e smalltv_ultra
; Output: .pio/build/smalltv_ultra/firmware.bin

[platformio]
default_envs = smalltv_ultra
src_dir = src

[common]
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.3.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D SMOOTH_FONT=0
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
  -D TFT_RGB_ORDER=1
  -D CGRAM_OFFSET=1
  -D TFT_INVERSION_ON=1

; ---------------------------------------------------------------------------
; SmallTV + SmallTV-Ultra — ESP-12F (ESP8266), 4 MB flash
; Ultra stock OTA often rejects a full image ("Not Enough Space").
; Flash smalltv-mod-loader.bin first, then this firmware.bin, or use UART.
; ---------------------------------------------------------------------------
[env:smalltv_ultra]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D BOARD_SMALLTV_ULTRA=1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=0
  -D TFT_SPI_MODE=3

; ---------------------------------------------------------------------------
; SmallTV knockoff with ESP32-C2 (ESP8684) + CH340C on USB-C
; ---------------------------------------------------------------------------
[env:smalltv_c2]
platform = espressif32
board = esp32-c2-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D BOARD_SMALLTV_C2=1
  -D TFT_MOSI=6
  -D TFT_SCLK=4
  -D TFT_CS=-1
  -D TFT_DC=5
  -D TFT_RST=1
  -D TFT_BL=18
  -D TFT_BACKLIGHT_ON=0

; ---------------------------------------------------------------------------
; GeekMagic SmallTV Pro — classic ESP32, 8 MB, USB-C is power-only
; ---------------------------------------------------------------------------
[env:smalltv_pro]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D BOARD_SMALLTV_PRO=1
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=-1
  -D TFT_DC=2
  -D TFT_RST=4
  -D TFT_BL=25
  -D TFT_BACKLIGHT_ON=0
